# Voice audition: free TTS engines in parallel on CPU runners, then one scoring job (UTMOS naturalness + whisper clarity).
# Source: reels-studio/cloud/. Trigger: python reels-studio/tools/gh_actions.py dispatch voice-audition.yml
name: voice-audition
on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'JSON list of engines: chatterbox, turbo, qwen3, orpheus, edge'
        default: '["chatterbox","turbo","qwen3","orpheus","edge"]'
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
jobs:
  tts:
    name: tts-${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reels-studio/cloud/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ${{ matrix.engine }}
        run: bash reels-studio/cloud/install.sh ${{ matrix.engine }}
      - name: Generate
        run: python reels-studio/cloud/tts_audition.py run ${{ matrix.engine }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ matrix.engine }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
  score:
    needs: tts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reels-studio/cloud/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          path: samples
          merge-multiple: true
      - name: Install scorer
        run: bash reels-studio/cloud/install.sh score
      - name: Score
        run: python reels-studio/cloud/tts_audition.py score --in samples --out results
      - uses: actions/upload-artifact@v4
        with:
          name: voice-audition-results
          path: results/
          retention-days: 30
