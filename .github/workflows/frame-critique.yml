name: frame-critique
on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Brief id (reels-studio/briefs/<id>.json)'
        required: true
      render_run:
        description: 'render mode: Actions run id whose artifact (render-<brief>) holds the mp4'
        required: false
      mode:
        description: 'render = critique our render | external = analyse third-party reels'
        default: 'render'
      video_urls:
        description: 'external mode: space-separated reel URLs (max 5)'
        required: false
      subject:
        description: 'external mode: label for the output doc, e.g. instagram-adilet.fndr'
        required: false
permissions:
  contents: write
  actions: read
jobs:
  critique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg for sampling
        run: pip install -q imageio-ffmpeg
      - name: Pull the render artifact
        if: ${{ inputs.mode != 'external' }}
        uses: actions/download-artifact@v4
        with:
          name: render-${{ inputs.brief }}
          run-id: ${{ inputs.render_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/render
      - name: Sample frames + pull the tool's own UI media
        if: ${{ inputs.mode != 'external' }}
        env:
          BRIEF: ${{ inputs.brief }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 reels-studio/tools/capture_store.py pull-for "reels-studio/briefs/$BRIEF.json"
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p /tmp/frames
          "$FF" -y -loglevel error -i /tmp/render/$BRIEF.mp4 -vf "fps=1/8,scale=512:-1" -q:v 4 /tmp/frames/f%02d.jpg
          ls /tmp/frames
                - name: Download + sample external reels
        if: ${{ inputs.mode == 'external' }}
        env:
          URLS: ${{ inputs.video_urls }}
        run: |
          set -e
          pip install -q yt-dlp
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p /tmp/ext
          i=0
          for u in $URLS; do
            i=$((i+1)); [ $i -gt 5 ] && break
            if echo "$u" | grep -q "instagram.com/reel\|instagram.com/p/\|tiktok.com\|youtube.com/shorts"; then
              yt-dlp --no-warnings -f "best[ext=mp4]/best" --write-info-json -o "/tmp/ext/v$i.%(ext)s" "$u"
              mv /tmp/ext/v$i.mp4 /tmp/ext/v$i-src.mp4 2>/dev/null || true
            else
              curl -sL -m 120 -H "User-Agent: Mozilla/5.0" "$u" -o "/tmp/ext/v$i-src.mp4"
              echo '{}' > /tmp/ext/v$i-src.info.json
            fi
            DUR=$("$FF" -i /tmp/ext/v$i-src.mp4 2>&1 | grep -oE 'Duration: [0-9:.]+' | head -1)
            mkdir -p /tmp/ext/frames-$i
            python3 - $i <<'EOF'
          import subprocess, sys, re, os
          i = sys.argv[1]
          ff = subprocess.run(["python3","-c","import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())"],capture_output=True,text=True).stdout.strip()
          p = subprocess.run([ff,'-i',f'/tmp/ext/v{i}-src.mp4'],capture_output=True,text=True)
          m = re.search(r'Duration: (\d+):(\d+):([\d.]+)', p.stderr)
          dur = int(m.group(1))*3600+int(m.group(2))*60+float(m.group(3))
          for j,t in enumerate([0.3, dur*.25, dur*.5, dur*.75, dur*.95]):
              subprocess.run([ff,'-y','-loglevel','error','-ss',f'{t:.2f}','-i',f'/tmp/ext/v{i}-src.mp4',
                              '-frames:v','1','-vf','scale=512:-1','-q:v','4',f'/tmp/ext/frames-{i}/f{j+1}.jpg'],check=True)
          print(f'v{i}: {dur:.1f}s sampled')
          EOF
          done
          python3 - <<'EOF'
          import json, glob
          pack = []
          for d in sorted(glob.glob('/tmp/ext/frames-*')):
              v = d.split('-')[-1]
              info = glob.glob(f'/tmp/ext/v{v}*.info.json')
              try: cap = json.load(open(info[0])).get('description','') if info else ''
              except Exception: cap = ''
              pack.append({'name': f'video-{v}', 'caption': cap,
                           'frames': sorted(glob.glob(d + '/*.jpg'))})
          json.dump(pack, open('/tmp/ext/frames.json','w'))
          print(json.dumps([{'name': p['name'], 'frames': len(p['frames'])} for p in pack], indent=1))
          EOF
                - name: VLM critique (NVIDIA NIM free endpoints)
        env:
          BRIEF: ${{ inputs.brief }}
          SUBJECT: ${{ inputs.subject }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "external" ]; then
            python3 reels-studio/tools/frame_critique.py "$SUBJECT" --external --frames-map /tmp/ext/frames.json --subject "$SUBJECT"
          else
            python3 reels-studio/tools/frame_critique.py "$BRIEF" --frames /tmp/frames --media "reels-studio/captures/$BRIEF"
          fi
                - name: Commit the critique
        env:
          BRIEF: ${{ inputs.brief }}
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add "reels-studio/research/critiques/$BRIEF-*.md" "reels-studio/research/critiques/$SUBJECT-*.md" 2>/dev/null || true
          git commit -q -m "critique: frame analysis $BRIEF (run ${{ inputs.render_run }})" || echo "no critique diff"
          git push
                - name: Upload critique artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critique-${{ inputs.brief }}
          path: reels-studio/research/critiques/
