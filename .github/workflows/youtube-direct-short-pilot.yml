name: Direct YouTube Short pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hypeless-publishing
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r reels-studio/tools/youtube/requirements.txt
      - name: Direct Short safety tests
        env:
          PYTHONPATH: ${{ github.workspace }}/reels-studio
        run: python3 -m unittest discover -s reels-studio/tests -p 'test_direct_shorts.py' -v
      - name: Run specifically authorized MoneyPrinterTurbo pilot
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_STATE_KEY: ${{ secrets.YOUTUBE_STATE_KEY }}
          DIRECT_SHORT_PILOT: moneyprinterturbo-2026-11-20
        run: python3 reels-studio/tools/youtube/direct_shorts.py
      - name: Remove temporary media
        if: always()
        run: rm -rf "$RUNNER_TEMP/direct-short"
