name: voice-lab
# Render one script in several TTS engines/settings (CPU) and publish MP3s to the `voice-lab` release,
# so the owner can listen and choose. Script + variants: reels-studio/voice-lab/*.json
on:
  workflow_dispatch:
    inputs:
      script:
        description: "script + variants JSON (repo path)"
        default: "reels-studio/voice-lab/script.json"
      tag:
        description: "release tag for the samples"
        default: "voice-lab"
      only:
        description: "comma list of variant names (empty = all)"
        default: ""

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reels-studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
            ~/.cache/pip
          key: voice-lab-v1-${{ hashFiles('reels-studio/voice-lab/requirements.txt') }}
      - name: Install (CPU torch + Chatterbox + Kokoro)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r reels-studio/voice-lab/requirements.txt
      - name: Render samples
        run: python3 reels-studio/voice-lab/lab.py "${{ inputs.script }}" --out /tmp/lab ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}
      - name: Publish to release
        run: python3 reels-studio/tools/publish_release.py --tag "${{ inputs.tag }}" --replace /tmp/lab/*.mp3 /tmp/lab/lab-report.json
