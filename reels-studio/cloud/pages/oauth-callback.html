<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Hypeless — Complete YouTube connection</title><style>body{background:#050b1f;color:#edf4ff;font:18px/1.6 system-ui;padding:40px}main{max-width:640px;margin:auto}h1{color:#ffd60a}p{color:#c2d4ed}</style></head><body><main><h1>Completing your connection…</h1><p id="status">Returning to your private setup session. No publishing occurs here.</p></main><script>(()=>{const q=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);try{const state=q.get('state');if(!state)throw Error('Missing session.');const raw=state.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');const data=JSON.parse(atob(raw.padEnd(Math.ceil(raw.length/4)*4,'=')));const origin=new URL(data.origin);if(origin.protocol!=='https:'||!origin.hostname.endsWith('.e2b.app')||origin.username||origin.password||origin.port||origin.pathname!=='/'||origin.search||origin.hash||data.expires*1000<Date.now())throw Error('Invalid or expired setup session.');const next=new URL('/oauth/complete',origin.origin);if(q.has('code'))next.searchParams.set('code',q.get('code'));if(q.has('error'))next.searchParams.set('error',q.get('error'));next.searchParams.set('state',state);location.replace(next.toString());}catch(e){document.getElementById('status').textContent='Connection not completed. Return to the agent and start a fresh setup session. No credentials or videos were published.';}})();</script></body></html>
