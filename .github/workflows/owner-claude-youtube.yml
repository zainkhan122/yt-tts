name: Owner approved Claude Short delivery
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: hypeless-publishing
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r reels-studio/tools/youtube/requirements.txt
      - name: Safety and dedicated-cover tests
        env:
          PYTHONPATH: ${{ github.workspace }}/reels-studio
        run: |
          set -e
          for t in test_dedicated_cover_gate.py test_house_outro_gate.py test_direct_shorts.py test_direct_short_production.py; do python3 -m unittest discover -s reels-studio/tests -p "$t"; done
      - name: Resume exact owner-approved job with one additional local upload start
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_STATE_KEY: ${{ secrets.YOUTUBE_STATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/reels-studio
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.post.common import config,load_json,now_utc,parse_time
          from tools.post.state import Journal
          from tools.youtube.direct_short_production import execute_job,pins,check_conflicts,check_time_conflicts
          from tools.youtube.direct_shorts import REMOTE
          from tools.youtube.api import YouTubeAPI
          from tools import ship
          root=Path('reels-studio');vid='claude-video-effects-03'
          cfg=load_json(root/'config/youtube.json');cfg['max_upload_starts_per_day']=3
          base=config();pub=Journal(base,remote=True);j=Journal(base,remote=True,path=root/'tracker/youtube-publications.json',remote_path=REMOTE)
          item=next(x for x in load_json(root/'queue/publish.json')['items'] if x['video_id']==vid)
          job=j.data['direct_short_jobs'][vid];rec=j.records.get(vid,{})
          assert job['state']=='pending' and job.get('error_code')=='UPLOAD_BUDGET' and not rec.get('youtube_id') and not rec.get('final_chunk_submitted')
          assert job['pins']==pins(item) and not ship.check(vid,root=root)
          check_conflicts(vid,pub.records,j.data,existing_job=True);check_time_conflicts(vid,parse_time(job['publish_at']),pub.records,j.data)
          job.pop('retry_at',None);job['owner_note']='Owner explicitly authorized an additional local upload start for exact approved Short';j.save('owner-authorized single extra upload start')
          api=YouTubeAPI(cfg,j);api.verify_channel();brief=load_json(root/'briefs'/f'{vid}.json')
          state=execute_job(job,item,brief,pub,j,api,base,Path(os.environ['RUNNER_TEMP'])/'direct-shorts'/vid)
          print('Direct delivery state:',state)
          if state!='scheduled':raise SystemExit('Not confirmed scheduled; reconcile existing reservation before retry')
          PY
