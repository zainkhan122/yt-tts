# Cloud render: one GitHub runner (4 vCPU / 16 GB) per brief, up to 10 in parallel.
# A single finalizer validates the whole batch, publishes one public GitHub Release, then deletes staging artifacts.
# Start: python3 reels-studio/reels.py cloud <brief-id> [<brief-id> ...]   (or Actions -> render -> Run workflow)
name: render
on:
  workflow_dispatch:
    inputs:
      briefs:
        description: 'Brief ids (reels-studio/briefs/<id>.json), space separated'
        required: true
      tag:
        description: 'Daily batch Release tag (default: renders-YYYY-MM-DD in Asia/Karachi; scene rebuilds remain artifacts)'
        required: false
        default: ''
      quality:
        description: 'draft | looks | delivery'
        required: false
        default: 'looks'
      crf:
        description: 'x264 CRF (23 = about 12-16 MB per 40 s)'
        required: false
        default: '23'
      rebuild_scenes:
        description: 'Single-scene rebuild: scene ids to re-render (needs a previous kit with a scene manifest)'
        required: false
        default: ''
      rebuild_reason:
        description: 'Why this rebuild (recorded in the manifest rebuild history)'
        required: false
        default: ''
      from_tag:
        description: 'Rebuild: release tag holding the published kit+mp4 (default: same tag as the output)'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: "1"
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"
  DO_NOT_TRACK: "1"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      briefs: ${{ steps.p.outputs.briefs }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reels-studio/briefs/
            /reels-studio/lib/
            /reels-studio/tools/validate_dispatch.py
          sparse-checkout-cone-mode: false
          filter: blob:none
      - id: p
        env:
          BRIEFS: ${{ inputs.briefs }}
          TAG: ${{ inputs.tag }}
          QUALITY: ${{ inputs.quality }}
          CRF: ${{ inputs.crf }}
          REBUILD_SCENES: ${{ inputs.rebuild_scenes }}
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
          FROM_TAG: ${{ inputs.from_tag }}
        run: python3 reels-studio/tools/validate_dispatch.py >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    name: render ${{ matrix.brief }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        brief: ${{ fromJSON(needs.plan.outputs.briefs) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRIEF: reels-studio/briefs/${{ matrix.brief }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reels-studio/
            /.github/workflows/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.cache/puppeteer
            ~/.cache/huggingface
            ~/.cache/pip
          key: hf-0.8.137-cbx-${{ runner.os }}-${{ hashFiles('reels-studio/setup/setup-whisper.sh', 'reels-studio/cloud/setup-render.sh') }}
      - name: Toolchain
        run: bash reels-studio/cloud/setup-render.sh
      - name: Capture pack
        run: python3 reels-studio/tools/capture_store.py pull-for "$BRIEF"
      - name: Render (voice, QA gates, video)
        env:
          REBUILD_SCENES: ${{ inputs.rebuild_scenes }}
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
          FROM_TAG: ${{ inputs.from_tag }}
        run: |
          extra=()
          if [ -n "$REBUILD_SCENES" ]; then
            extra=(--rebuild-scenes "$REBUILD_SCENES" --rebuild-reason "$REBUILD_REASON" --from-tag "${FROM_TAG:-${{ needs.plan.outputs.tag }}}")
          fi
          python3 reels-studio/reels.py make "$BRIEF" --quality "${{ inputs.quality }}" --crf "${{ inputs.crf }}" "${extra[@]}"
      - name: SEO pack (gate)
        run: python3 reels-studio/tools/seo_pack.py "$BRIEF"
      - name: Gate receipt (rule IDs -> manifest)
        run: python3 reels-studio/reels.py gates "$BRIEF"
      - name: Upload render artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.brief }}
          path: reels-studio/renders/${{ matrix.brief }}/
          if-no-files-found: error
          retention-days: 1
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.brief }}
          path: /var/tmp/reels/${{ matrix.brief }}/build.log
          if-no-files-found: ignore
          retention-days: 7
  publish:
    if: ${{ success() && inputs.rebuild_scenes == '' }}
    needs: [plan, render]
    name: publish verified GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reels-studio/briefs/
            /reels-studio/lib/
            /reels-studio/tools/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Download temporary render artifacts on runner
        uses: actions/download-artifact@v4
        with:
          pattern: render-*
          path: release-artifacts
          merge-multiple: false
      - name: Verify complete batch, publish one Release, and remove staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFS_JSON: ${{ needs.plan.outputs.briefs }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python3 reels-studio/tools/publish_verified_batch.py
          --briefs-json "$BRIEFS_JSON"
          --tag "$RELEASE_TAG"
          --artifact-root release-artifacts
          --run-id "$RUN_ID"
