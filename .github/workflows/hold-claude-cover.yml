name: Hold Claude upload for cover correction
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: hypeless-publishing
  cancel-in-progress: false
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r reels-studio/tools/youtube/requirements.txt
      - name: Verify private status and remove any scheduled time
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          PYTHONPATH: ${{ github.workspace }}/reels-studio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.post.common import config,load_json,iso,now_utc
          from tools.post.state import Journal
          from tools.youtube.direct_shorts import REMOTE
          from tools.youtube.api import YouTubeAPI
          from tools.youtube.metadata import get_video
          j=Journal(config(),remote=True,path=Path('reels-studio/tracker/youtube-publications.json'),remote_path=REMOTE)
          vid='claude-video-effects-02';yid='O5tA5roQIng';rec=j.records[vid];job=j.data['direct_short_jobs'][vid]
          assert rec['youtube_id']==yid and job['state']=='needs_review'
          api=YouTubeAPI(load_json(Path('reels-studio/config/youtube.json')),j);v=get_video(api,yid);assert v['status']['privacyStatus']=='private'
          if v['status'].get('publishAt'):
              st={k:v['status'][k] for k in ('license','embeddable','publicStatsViewable','selfDeclaredMadeForKids','containsSyntheticMedia') if k in v['status']};st['privacyStatus']='private'
              api.json('PUT','videos',params={'part':'status'},body={'id':yid,'status':st},headers={'If-Match':v['etag']} if v.get('etag') else {},cost=50,idempotent=True)
          fresh=get_video(api,yid);assert fresh['status']['privacyStatus']=='private' and not fresh['status'].get('publishAt')
          rec.update(state='cancelled',hold_reason='Dedicated-cover correction',hold_verified_at=iso(now_utc()));job.update(state='cancelled',hold_verified_at=iso(now_utc()));j.save('verify Claude upload private with no scheduled publication')
          print('CONFIRMED private and unscheduled; no deletion')
          PY
