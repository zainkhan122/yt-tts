# Score voice samples from one or more earlier voice-audition runs (UTMOS naturalness + whisper clarity) -> one table.
# Trigger: python reels-studio/tools/gh_actions.py dispatch voice-score.yml -i "run_ids=123 456"
name: voice-score
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'Space-separated voice-audition run ids whose voice-* artifacts should be scored together'
        required: true
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reels-studio/cloud/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in ${{ inputs.run_ids }}; do
            gh run download "$id" --repo "${{ github.repository }}" --pattern 'voice-*' --dir "samples/$id" || echo "no artifacts in $id"
          done
          find samples -type f | sort
      - name: Install scorer
        timeout-minutes: 12
        run: bash reels-studio/cloud/install.sh score
      - name: Score
        run: python reels-studio/cloud/tts_audition.py score --in samples --out results
      - uses: actions/upload-artifact@v4
        with:
          name: voice-audition-results
          path: results/
          retention-days: 30
